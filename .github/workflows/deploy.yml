name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gate the deploy on the consent scan. We self-host the CMP, so nothing
      # else watches for trackers added without being declared in the consent
      # config — an undeclared cookie firing before consent breaks TDDDG § 25 and
      # fails Google's EU User Consent Policy audit, which can suspend conversion
      # measurement and take the Ad Grant with it. Cheap check, expensive miss.
      - name: Consent scan
        run: node scripts/consent-scan.mjs

      # 2. Build Docker images
      - name: Build Docker images
        run: |
          docker build \
            -t registry.infra.codingforchange.com/homepage-website:${{ github.sha }} \
            -t registry.infra.codingforchange.com/homepage-website:latest \
            ./outer
          
          docker build \
            -t registry.infra.codingforchange.com/homepage-inner:${{ github.sha }} \
            -t registry.infra.codingforchange.com/homepage-inner:latest \
            ./inner
            
          docker build \
            -t registry.infra.codingforchange.com/homepage-cms:${{ github.sha }} \
            -t registry.infra.codingforchange.com/homepage-cms:latest \
            ./inner/cms

      # 3. Push to private registry
      - name: Login to registry
        run: |
          docker login registry.infra.codingforchange.com \
            -u ${{ secrets.REGISTRY_USERNAME }} \
            -p ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Docker images
        run: |
          docker push registry.infra.codingforchange.com/homepage-website:${{ github.sha }}
          docker push registry.infra.codingforchange.com/homepage-website:latest
          
          docker push registry.infra.codingforchange.com/homepage-inner:${{ github.sha }}
          docker push registry.infra.codingforchange.com/homepage-inner:latest
          
          docker push registry.infra.codingforchange.com/homepage-cms:${{ github.sha }}
          docker push registry.infra.codingforchange.com/homepage-cms:latest

      # 4. Deploy to VPS via SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H codingforchange.com >> ~/.ssh/known_hosts

      - name: Copy files to VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          SSH_TARGET="deploy-homepage@codingforchange.com"

          # Ensure target directory exists
          $SSH $SSH_TARGET "mkdir -p /var/www/homepage"

          # Copy docker-compose (prod → docker-compose.yml on VPS)
          $SCP docker-compose.prod.yml ${SSH_TARGET}:/var/www/homepage/docker-compose.yml

          # Copy Caddyfile
          $SCP Caddyfile ${SSH_TARGET}:/var/www/homepage/Caddyfile

          # Write .env from GitHub secrets and copy to VPS.
          #
          # This OVERWRITES /var/www/homepage/.env wholesale — deliberately, so
          # the server holds no configuration that isn't reproducible from here.
          # Consequence: anything added to that file by hand is lost on the next
          # deploy, so every value must come from a secret.
          #
          # The Ads / GA4 ids are required for Ad Grants compliance, and an unset
          # one is SILENT: GoogleTag.tsx renders no tag at all, the deploy goes
          # green, and conversion tracking simply stops. If you add a new
          # conversion action, add its secret here in the same commit.
          printf '%s\n' \
            "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
            "DATABASE_URL=postgresql://payload:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/payload" \
            "PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}" \
            "CMS_URL=http://cms:3000" \
            "INNER_URL=http://inner:80" \
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
            "EMAIL_FROM=info@codingforchange.com" \
            "EMAIL_FROM_NAME=Coding for Change" \
            "CONTACT_TO_EMAIL=info@codingforchange.com" \
            "GOOGLE_ADS_CONVERSION_ID=${{ secrets.GOOGLE_ADS_CONVERSION_ID }}" \
            "GOOGLE_ADS_LABEL_WAITLIST=${{ secrets.GOOGLE_ADS_LABEL_WAITLIST }}" \
            "GOOGLE_ADS_LABEL_CONTACT=${{ secrets.GOOGLE_ADS_LABEL_CONTACT }}" \
            "GOOGLE_ADS_LABEL_APPLICATION=${{ secrets.GOOGLE_ADS_LABEL_APPLICATION }}" \
            "GOOGLE_ADS_LABEL_TECHTOUR=${{ secrets.GOOGLE_ADS_LABEL_TECHTOUR }}" \
            "GOOGLE_ADS_LABEL_BOOKING=${{ secrets.GOOGLE_ADS_LABEL_BOOKING }}" \
            "GA4_MEASUREMENT_ID=${{ secrets.GA4_MEASUREMENT_ID }}" \
            > /tmp/.env
          $SCP /tmp/.env ${SSH_TARGET}:/var/www/homepage/.env
          rm -f /tmp/.env

      - name: Deploy on VPS
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy-homepage@codingforchange.com"

          $SSH "cd /var/www/homepage && \
            docker compose pull && \
            docker compose up -d"
