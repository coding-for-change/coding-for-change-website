services:
  # Outer 3D website (Three.js + Express) — single entry point
  website:
    labels:
      alloy-logging: true
    build:
      context: ./outer
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      - CMS_URL=http://cms:3000
      - INNER_URL=http://inner:3000
    depends_on:
      - inner
      - cms

  # Inner site (Next.js app — SSR server, embedded as iframe)
  inner:
    labels:
      alloy-logging: true
    build:
      context: ./inner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server-side CMS fetches go directly to the CMS container.
      - CMS_INTERNAL_URL=http://cms:3000/api
      # Google Ads / GA4 tag IDs — read at runtime by the server-rendered
      # layout, so a change needs only a restart, not an image rebuild. Unset
      # means no gtag.js is emitted at all. See .env.example.
      - GOOGLE_ADS_CONVERSION_ID=${GOOGLE_ADS_CONVERSION_ID:-}
      - GOOGLE_ADS_LABEL_WAITLIST=${GOOGLE_ADS_LABEL_WAITLIST:-}
      - GOOGLE_ADS_LABEL_APPLICATION=${GOOGLE_ADS_LABEL_APPLICATION:-}
      - GOOGLE_ADS_LABEL_TECHTOUR=${GOOGLE_ADS_LABEL_TECHTOUR:-}
      - GOOGLE_ADS_LABEL_CONTACT=${GOOGLE_ADS_LABEL_CONTACT:-}
      - GOOGLE_ADS_LABEL_BOOKING=${GOOGLE_ADS_LABEL_BOOKING:-}
      - GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID:-}
    depends_on:
      - cms

  # Payload CMS (admin panel + REST API)
  cms:
    labels:
      alloy-logging: true
    build:
      context: ./inner/cms
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://payload:payload@postgres:5432/payload
    volumes:
      - cms-media:/app/media
      - cms-applicant-files:/app/applicant-files
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL for Payload CMS
  postgres:
    labels:
      alloy-logging: true
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  cms-media:
  cms-applicant-files:
