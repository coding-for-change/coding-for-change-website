services:
  website:
    labels:
      alloy-logging: true
    image: localhost:5000/homepage-website:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CMS_URL=http://cms:3000
      - INNER_URL=http://inner:3000
    depends_on:
      - inner
      - cms

  inner:
    labels:
      alloy-logging: true
    image: localhost:5000/homepage-inner:latest
    restart: unless-stopped
    environment:
      # Server-side CMS fetches go directly to the CMS container.
      - CMS_INTERNAL_URL=http://cms:3000/api
      # Google Ads / GA4 tag IDs — read at runtime by the server-rendered
      # layout, so a change needs only a restart, not an image rebuild. Unset
      # means no gtag.js is emitted at all. See .env.example.
      - GOOGLE_ADS_CONVERSION_ID=${GOOGLE_ADS_CONVERSION_ID:-}
      - GOOGLE_ADS_LABEL_WAITLIST=${GOOGLE_ADS_LABEL_WAITLIST:-}
      - GOOGLE_ADS_LABEL_APPLICATION=${GOOGLE_ADS_LABEL_APPLICATION:-}
      - GOOGLE_ADS_LABEL_TECHTOUR=${GOOGLE_ADS_LABEL_TECHTOUR:-}
      - GOOGLE_ADS_LABEL_CONTACT=${GOOGLE_ADS_LABEL_CONTACT:-}
      - GOOGLE_ADS_LABEL_BOOKING=${GOOGLE_ADS_LABEL_BOOKING:-}
      - GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID:-}

  cms:
    labels:
      alloy-logging: true
    image: localhost:5000/homepage-cms:latest
    restart: unless-stopped
    env_file:
      - .env
    # Payload's default upload location is ./media relative to WORKDIR (/app).
    # Without this volume, every container recreation wipes uploaded files
    # while the Postgres-backed metadata rows survive — leaving 500s on
    # /api/media/file/* for every existing Media record.
    volumes:
      - cms-media:/app/media
      - cms-applicant-files:/app/applicant-files
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    labels:
      alloy-logging: true
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payload
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  cms-media:
  cms-applicant-files:
