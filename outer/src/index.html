    <h1>Coding for Change — Munich's Student Initiative for Social Tech</h1>
    <p>Coding for Change is a Verein and Technical University of Munich (TUM) student initiative
       based in Munich (München). We build software for NGOs, host hackathons, and bring students
       together to use code for social good. As an officially registered eingetragener Verein, we
       partner with non-profits across Germany to deliver software development that would otherwise
       be out of reach for them — and we give TUM students the chance to ship real, high-impact
       code while they're still studying.</p>

    <h2>What we do</h2>
    <p>We run project teams that pair student developers with NGOs that need a website, a data
       pipeline, an internal tool, or a mobile app. Past and current work spans the social,
       educational, environmental and humanitarian sectors. Alongside our project work we host
       hackathons, workshops and community events that bring together computer science students,
       designers, and partner organizations from across the Munich tech and social-impact scene.</p>

    <h2>For TUM students</h2>
    <p>If you are a TUM student interested in social-impact technology, Coding for Change is the
       place to put your skills to work. No prior experience with NGO software is required — we
       onboard members of all levels and you'll learn full-stack development, project management,
       and stakeholder communication on a real project with a real client. Visit our
       <a href="/join">membership page</a> to apply or our <a href="/about">about page</a> to read
       more about how we work.</p>

    <h2>For NGOs</h2>
    <p>If you are a non-profit looking for a software development partner, we'd love to hear from
       you. We work pro bono with mission-aligned organizations on scoped projects that we can
       deliver within a semester or academic year. See our <a href="/projects">projects</a> for
       examples of past work and our <a href="/contact">contact page</a> to get in touch.</p>
