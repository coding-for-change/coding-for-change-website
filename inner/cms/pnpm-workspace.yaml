# pnpm 10+ reads overrides from here, not from the package.json `pnpm` field.
overrides:
  '@payloadcms/drizzle': 3.79.1

# Allowlist for pnpm's opt-in postinstall-script security model.
onlyBuiltDependencies:
  - esbuild
  - sharp

# Local fixes to installed packages (patches/, created with `pnpm patch`).
# plugin-mcp: backport of the 3.93.0 fix for TypeScript 6 – without it every
# MCP key with an "update" box ticked hangs /api/mcp. Drop it once Payload is
# upgraded to >= 3.93.0.
patchedDependencies:
  '@payloadcms/plugin-mcp@3.79.1': patches/@payloadcms__plugin-mcp@3.79.1.patch
