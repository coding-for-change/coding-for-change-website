# pnpm 10+ reads overrides from here, not from the package.json `pnpm` field.
overrides:
  '@payloadcms/drizzle': 3.90.2
  # drizzle-kit (pinned by @payloadcms/db-postgres) and its @esbuild-kit loader
  # pin esbuild 0.25 / 0.18, whose binaries are built with Go releases that
  # have critical stdlib CVEs. Same esbuild line as tsx/vite use.
  'drizzle-kit>esbuild': ^0.27.7
  '@esbuild-kit/core-utils>esbuild': ^0.27.7

# Allowlist for pnpm's opt-in postinstall-script security model.
onlyBuiltDependencies:
  - esbuild
  - sharp
